# 本地开发 PostgreSQL（规格 01 §4：本地 docker-compose 起 PG）
services:
  postgres:
    image: postgres:15-alpine
    container_name: workbench-pg
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
